# XenonRecomp configuration for Naughty Bear (Xbox 360).
# Paths are relative to this file.

[main]
file_path = "../game/Naughty_Bear/Default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "NB_switch_tables.toml"

# Leave optimizations off until the recompilation runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (found by the byte patterns in XenonRecomp's README).
restgprlr_14_address = 0x8308CC10
savegprlr_14_address = 0x8308CBC0
restfpr_14_address = 0x8308E9DC
savefpr_14_address = 0x8308E990
restvmx_14_address = 0x83090328
savevmx_14_address = 0x83090090
restvmx_64_address = 0x830903BC
savevmx_64_address = 0x83090124

# Found via the RtlUnwind call inside longjmp; setjmp follows it.
longjmp_address = 0x830968F0
setjmp_address = 0x83096C10

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    # Exception handler pointer + handler data stored in front of functions that use them
    # (found with tools/nbanalyse/eh_handlers).
    { data = 0x8308D5D8, size = 8 }, # C++ frame handler
    { data = 0x83233264, size = 8 }, # C specific handler
    { data = 0x830B01A0, size = 8 }, # Custom handler
    { data = 0x00485645, size = 0x2EC }, # Data after the last function, up to the end of .text (0x832343D8-0x832346C4)
]

# Leaf functions containing jump tables, which XenonRecomp's analyzer cuts short.
# BEGIN nb_switch_tables functions
